plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

def osName = System.getProperty("os.name").toLowerCase()
def pyExe = osName.contains("windows") ? "python" : "python3"

android {
    namespace 'com.castrite.twobody'
    compileSdk 34

    defaultConfig {
        applicationId "com.castrite.twobody"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1"

        // 只打 arm64：手机是 arm64-v8a，其它架构不要，省体积。
        ndk {
            abiFilters "arm64-v8a"
        }

        python {
            // 构建机上用的 Python，只用来打包，不参与运行。
            buildPython pyExe
            // 白板阶段 0 个 pip 包——核心代码全是标准库。
            pip {
            }
        }
    }

    signingConfigs {
        fixed {
            // CI 会先把 KEYSTORE_BASE64 解成 signing/ta.p12；本地有就用本地那份。
            // 固定签名的意义：新版本能覆盖安装，数据不用卸载重装。
            def ks = rootProject.file("signing/ta.p12")
            if (ks.exists()) {
                storeFile ks
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: "ta-signing-2026"
                keyAlias "ta"
                keyPassword System.getenv("KEYSTORE_PASSWORD") ?: "ta-signing-2026"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
        debug {
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // FileProvider：应用内更新下载完的 APK 要交给系统安装器
    implementation 'androidx.core:core:1.13.1'
}
