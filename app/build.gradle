plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

def osName = System.getProperty("os.name").toLowerCase()
def pyExe = osName.contains("windows") ? "python" : "python3"

android {
    namespace 'com.castrite.twobody'
    compileSdk 34

    defaultConfig {
        applicationId "com.castrite.twobody"
        minSdk 26
        targetSdk 34
        // versionCode 用 CI 构建号（覆盖安装靠它递增）
        // versionName 跟 release 走：发版时手动改这里，别用构建号——
        // 否则每次构建都是"新版本"，更新检查会天天喊"有新版"
        def buildNo = (System.getenv("BUILD_NUMBER") ?: "1").toInteger()
        versionCode buildNo
        versionName "0.6"

        // 只打 arm64：手机是 arm64-v8a，其它架构不要，省体积。
        ndk {
            abiFilters "arm64-v8a"
        }

        python {
            // 构建机上用的 Python，只用来打包，不参与运行。
            buildPython pyExe
            // 白板阶段 0 个 pip 包——核心代码全是标准库。
            pip {
            }
        }
    }

    signingConfigs {
        fixed {
            def ks = rootProject.file("signing/ta.p12")
            println "SIGNING: keystore=" + ks + " exists=" + ks.exists()
            if (ks.exists()) {
                storeFile ks
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: "ta-signing-2026"
                keyAlias "ta"
                keyPassword System.getenv("KEYSTORE_PASSWORD") ?: "ta-signing-2026"
                // ColorOS 的安装界面只认 v1（JAR）签名，必须三档都开
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
        debug {
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // FileProvider：应用内更新下载完的 APK 要交给系统安装器
    implementation 'androidx.core:core:1.13.1'
}
